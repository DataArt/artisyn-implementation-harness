name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Deploy affected
        run: echo "CD deploy retired pending GitHub Pages cutover — see solution/Architecture.md" && exit 0
