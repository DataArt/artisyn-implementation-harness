name: Release harness

# Tags, publishes and attests the harness version that main carries, after every merge. The PR
# already chose and stamped that version (`yarn harness:version`, checked by version-gate in
# ci.yml), so this workflow never commits or pushes to main: it creates the tag through the API and
# everything runs with GITHUB_TOKEN, no bypass actor needed (TD-5). This is the repository's only
# release lane: the root `v*` lane (semantic-release) is retired.

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-harness
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PACKAGE: '@dataart/artisyn-implementation-harness'
      TAG_PREFIX: artisyn-implementation-harness-v
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The commit that triggered this run, with every tag. No credentials stay on disk.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Tag the version this commit carries
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./skills/implementation-harness/package.json').version")"
          tag="${TAG_PREFIX}${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            # Released by an earlier merge (this merge did not change the harness), or a re-run:
            # finish whatever that release is missing.
            # A tag that lacks harness changes of this commit means a PR merged with a version
            # that was already released (stamped before the previous release was tagged).
            if ! git diff --quiet "${tag}" "${GITHUB_SHA}" -- skills/implementation-harness; then
              echo "::error::${tag} is already released, but this commit changes the harness after it. Run yarn harness:version on a new branch and merge the stamp."
              exit 1
            fi
            echo "${tag} exists. Checking that it is fully published."
          else
            # A ruleset on branches does not cover tags, so GITHUB_TOKEN can create it.
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
            git tag "${tag}" "${GITHUB_SHA}"
            echo "Tagged ${GITHUB_SHA} as ${tag}."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check what is already published
        id: state
        run: |
          set -uo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${tag#${TAG_PREFIX}}"
          zip="${TAG_PREFIX}${version}.zip"
          package_ok=false
          yarn npm info "${PACKAGE}@${version}" version >/dev/null 2>&1 && package_ok=true
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          assets_ok=false
          if echo "$assets" | grep -qx "$zip" && echo "$assets" | grep -qx "${zip}.sha256"; then assets_ok=true; fi
          if [ "$package_ok" = true ] && [ "$assets_ok" = true ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${tag} is fully published (package and release assets). Nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${tag}: package published=${package_ok}, release assets present=${assets_ok}"
          fi

      - name: Check out the release tag
        if: steps.state.outputs.published == 'false'
        run: git checkout --detach "${{ steps.version.outputs.tag }}"

      - name: Build the tarball and the ZIP
        id: build
        if: steps.state.outputs.published == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${tag#${TAG_PREFIX}}"
          mkdir -p dist
          yarn workspace "$PACKAGE" pack --out "$GITHUB_WORKSPACE/dist/${TAG_PREFIX}${version}.tgz"
          scratch="$(mktemp -d)"
          tar -xzf "dist/${TAG_PREFIX}${version}.tgz" -C "$scratch"
          mv "$scratch/package" "$scratch/implementation-harness"
          (cd "$scratch" && zip -r -X "$GITHUB_WORKSPACE/dist/${TAG_PREFIX}${version}.zip" implementation-harness)
          (cd dist && sha256sum "${TAG_PREFIX}${version}.zip" > "${TAG_PREFIX}${version}.zip.sha256")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball
        if: steps.state.outputs.published == 'false'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tgz

      - name: Attest the ZIP
        if: steps.state.outputs.published == 'false'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.zip

      - name: Publish to GitHub Packages
        if: steps.state.outputs.published == 'false'
        run: yarn workspace "$PACKAGE" npm publish --tolerate-republish

      - name: Create the GitHub Release and attach the ZIP and its checksum
        if: steps.state.outputs.published == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.build.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          gh release upload "$tag" "dist/${TAG_PREFIX}${version}.zip" "dist/${TAG_PREFIX}${version}.zip.sha256" --clobber
