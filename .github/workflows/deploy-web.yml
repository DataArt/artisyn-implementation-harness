name: Deploy web

# Builds the site (Web Explorer, Web Docs, composed by Web Portal) and deploys it to GitHub Pages.
# Starts only when a push touches the site: the web apps or the docs Web Docs renders. Both make
# web-portal affected, so the affected build always produces apps/web-portal/dist. (A change to
# this file alone affects no project, so it is not in the filter; it takes effect on the next
# site change.)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-*/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Affected by the whole push (every commit since the previous tip of main), not only its
      # last commit.
      - name: Build site
        run: yarn nx affected --target=build --configuration=ci --base=${{ github.event.before }} --head=HEAD
        env:
          VITE_GITHUB_ORG: ${{ vars.VITE_GITHUB_ORG }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO }}
          VITE_GISCUS_REPO_ID: ${{ vars.VITE_GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY_ID: ${{ vars.VITE_GISCUS_CATEGORY_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web-portal/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
