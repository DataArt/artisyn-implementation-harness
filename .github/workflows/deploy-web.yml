name: Deploy web

# Builds the site (Web Explorer, Web Docs, composed by Web Portal) and deploys it to GitHub Pages.
# Nx decides what to build: the affected projects of the whole push. When web-portal is not among
# them (a push that does not touch the site), there is no apps/web-portal/dist and the Pages steps
# are skipped, so nothing is deployed.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Affected by the whole push (every commit since the previous tip of main), not only its
      # last commit.
      - name: Build site
        run: yarn nx affected --target=build --configuration=ci --base=${{ github.event.before }} --head=HEAD
        env:
          VITE_GITHUB_ORG: ${{ vars.VITE_GITHUB_ORG }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO }}
          VITE_GISCUS_REPO_ID: ${{ vars.VITE_GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY_ID: ${{ vars.VITE_GISCUS_CATEGORY_ID }}

      - name: Check the build produced the site
        id: site
        run: |
          if [ -d apps/web-portal/dist ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The site is not affected by this push; nothing to deploy."
          fi

      - name: Configure Pages
        if: steps.site.outputs.built == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.site.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web-portal/dist

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.built == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
