name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

# Three stages, each waiting for the one before, so nothing runs on a change that already failed:
#   1. build-and-test                          audit, lint, typecheck, test and build what changed
#   2. version-gate · docs-gate · harness-package
#   3. harness-cli                             the install CLI on ubuntu, macos and windows
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Audit
        run: yarn npm audit --all --severity moderate

      - name: Lint (affected)
        run: yarn nx affected --target=lint --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Typecheck (affected)
        run: yarn nx affected --target=typecheck --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Test (affected)
        run: yarn nx affected --target=test --base=origin/${{ github.base_ref }} --head=HEAD

      - name: Build (affected)
        run: yarn nx affected --target=build --configuration=ci --base=origin/${{ github.base_ref }} --head=HEAD

  # Required checks on `main` (D-17): build-and-test, version-gate, docs-gate.
  version-gate:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Harness version is consistent across SKILL.md, plugin.json and the marketplaces
        run: node scripts/release/stamp-harness-version.mjs --check

      # The PR carries its own release: the version its commits call for, stamped by
      # `yarn harness:version`. The merge workflow only tags and publishes it (TD-5).
      - name: Harness is stamped with the version its commits call for
        run: node scripts/release/version-harness.mjs --check

  docs-gate:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install instructions are pinned and name the skill correctly
        run: node scripts/check-docs.mjs

      - name: Commits touching the harness use scope harness
        run: node scripts/check-commit-scope.mjs --range origin/${{ github.base_ref }}..HEAD

  harness-package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Package contents match the allowlist
        run: node scripts/ci/check-pack.mjs

      - name: Plugin and marketplace manifests are valid
        run: node scripts/validate-plugin.mjs
        env:
          CLAUDE_CMD: yarn dlx --quiet -p @anthropic-ai/claude-code@2.1.311 claude

      - name: Release dry run
        run: yarn nx release version --projects=artisyn-implementation-harness --dry-run

  harness-cli:
    name: harness-cli (${{ matrix.os }})
    needs: [version-gate, docs-gate, harness-package]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Patch bundle paths exceed the 260-character Windows limit; git needs long paths before checkout.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install CLI and state root tests
        shell: bash
        run: yarn workspace @artisyn-harness/implementation-harness-e2e vitest run --config vitest.unit.config.ts src/tests/unit/cli src/tests/unit/state-root.spec.ts
