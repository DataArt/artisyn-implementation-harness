name: Deploy harness

# Builds the harness version that main carries after every merge, and publishes it once a reviewer
# approves. The PR already chose and stamped that version (`yarn harness:version`, checked by
# version-gate in ci-harness.yml), so this workflow never commits or pushes to main and runs with
# GITHUB_TOKEN only, no bypass actor needed. Nx Release is the repository's only release lane.
#
#   build                    automatic: build the tarball and the ZIP, attest them, keep them as an
#                            artifact
#   release                  waits for approval in the `release` environment, then creates the tag
#                            through the API, so every channel opens at once
#   publish-github-packages  publishes the npm package to GitHub Packages
#   publish-github           publishes the GitHub Release with the ZIP and its checksum (draft
#                            first, so an immutable release gets its assets before it is published)
#   publish-npmjs            stub: npmjs.com is not a channel yet; it reports and publishes nothing
# The publish jobs run in parallel after approval; each can be re-run on its own.
#
# Only a push that touches the package or its channel manifests starts it (the same paths the
# commit scope rule calls harness files), plus this workflow itself. A site-only merge starts
# nothing. To finish a release without a new merge, re-run its run or start this workflow by hand.

on:
  push:
    branches: [main]
    paths:
      - 'skills/implementation-harness/**'
      - 'skills/.claude-plugin/**'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.github/plugin/**'
      - 'skills.sh.json'
      - '.github/workflows/deploy-harness.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-harness
  cancel-in-progress: false

env:
  PACKAGE: '@dataart/artisyn-implementation-harness'
  # Releases are tagged v<version> (up to 4.0.2 they were artisyn-implementation-harness-v<version>).
  # The ZIP and the tarball keep the descriptive name.
  TAG_PREFIX: v
  ASSET_PREFIX: artisyn-implementation-harness-v

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.state.outputs.publish }}
    steps:
      # A manual run can start from any branch. The `release` environment only accepts `main`, but
      # this job would still build and attest that branch's package first.
      - name: Only main is released
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Deploy harness runs from main only (this run: ${GITHUB_REF})."
            exit 1
          fi

      # The commit that triggered this run, with every tag. No credentials stay on disk.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Read the version this commit carries
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./skills/implementation-harness/package.json').version")"
          tag="${TAG_PREFIX}${version}"
          # An existing tag means an earlier merge released this version, or this is a re-run:
          # finish whatever that release is missing. A tag that lacks harness changes of this commit
          # means a PR merged with a version that was already released (stamped before the
          # previous release was tagged).
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null &&
            ! git diff --quiet "${tag}" "${GITHUB_SHA}" -- skills/implementation-harness; then
            echo "::error::${tag} is already released, but this commit changes the harness after it. Run yarn harness:version on a new branch and merge the stamp."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check what is already published
        id: state
        run: |
          set -uo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          zip="${ASSET_PREFIX}${version}.zip"
          package_ok=false
          yarn npm info "${PACKAGE}@${version}" version >/dev/null 2>&1 && package_ok=true
          # Published (not a draft) and carrying the ZIP and its checksum.
          release_ok="$(gh release view "$tag" --json isDraft,assets --jq "(.isDraft | not) and ([.assets[].name] | index(\"${zip}\") != null and index(\"${zip}.sha256\") != null)" 2>/dev/null || echo false)"
          if [ "$package_ok" = true ] && [ "$release_ok" = true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${tag} is fully published (package and release). Nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${tag}: package published=${package_ok}, release published with assets=${release_ok}"
          fi

      - name: Build the tarball and the ZIP
        if: steps.state.outputs.publish == 'true'
        run: |
          set -euo pipefail
          name="${ASSET_PREFIX}${{ steps.version.outputs.version }}"
          mkdir -p dist
          yarn workspace "$PACKAGE" pack --out "$GITHUB_WORKSPACE/dist/${name}.tgz"
          scratch="$(mktemp -d)"
          tar -xzf "dist/${name}.tgz" -C "$scratch"
          mv "$scratch/package" "$scratch/implementation-harness"
          (cd "$scratch" && zip -r -X "$GITHUB_WORKSPACE/dist/${name}.zip" implementation-harness)
          (cd dist && sha256sum "${name}.zip" > "${name}.zip.sha256")
          # The release notes are this version's changelog entry, as semantic-release did it.
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            /^##? / { if (found) exit; if ($0 ~ "^## \\[?" v "[] ]") found = 1 }
            found { print }
          ' skills/implementation-harness/CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::skills/implementation-harness/CHANGELOG.md has no entry for ${version}."
            exit 1
          fi

      - name: Attest the tarball
        if: steps.state.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tgz

      - name: Attest the ZIP
        if: steps.state.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.zip

      - name: Keep the artifacts for the publish job
        if: steps.state.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: harness-release
          path: dist/
          if-no-files-found: error

  # Approval gate. The tag is created only here, so every channel opens at once.
  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the run wait for approval here.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Create the tag through the API
        run: |
          set -euo pipefail
          # A ruleset on branches does not cover tags, so GITHUB_TOKEN can create it.
          if git fetch -q origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
            # Another run released this version while this one waited for approval. Publishing
            # now would skip this commit's harness changes, so stop instead.
            if ! git diff --quiet "${TAG}" "${GITHUB_SHA}" -- skills/implementation-harness; then
              echo "::error::${TAG} was released from another commit while this run waited, and this commit changes the harness after it. Run yarn harness:version on a new branch and merge the stamp."
              exit 1
            fi
            echo "${TAG} exists."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
            echo "Tagged ${GITHUB_SHA} as ${TAG}."
          fi

  publish-github-packages:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: harness-release
          path: dist/

      # `yarn npm publish` packs the workspace itself; it cannot upload a file. Yarn packs
      # reproducibly, and this job runs on the same runner image as build, so its pack must be
      # byte-identical to the attested tarball. Check that before publishing, and check the
      # registry's integrity after, so the package on GitHub Packages is the attested one.
      - name: Check the package packs to the attested tarball
        run: |
          set -euo pipefail
          yarn workspace "$PACKAGE" pack --out "$RUNNER_TEMP/repack.tgz"
          if ! cmp -s "dist/${ASSET_PREFIX}${VERSION}.tgz" "$RUNNER_TEMP/repack.tgz"; then
            echo "::error::The package does not pack to the attested tarball; publishing would ship unattested bytes."
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: yarn workspace "$PACKAGE" npm publish --tolerate-republish

      - name: Check the registry holds the attested tarball
        run: |
          set -euo pipefail
          expected="$(node -e 'const c = require("node:crypto"), f = require("node:fs"); console.log("sha512-" + c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' "dist/${ASSET_PREFIX}${VERSION}.tgz")"
          actual="$(yarn npm info "${PACKAGE}@${VERSION}" --fields dist --json | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).dist.integrity))')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::GitHub Packages holds ${PACKAGE}@${VERSION} with integrity ${actual}, but the attested tarball is ${expected}."
            exit 1
          fi
          echo "GitHub Packages holds the attested tarball (${actual})."

  publish-github:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-release
          path: dist/

      # Draft first, so an immutable release gets its assets before it is published.
      - name: Publish the GitHub Release with the ZIP and its checksum
        run: |
          set -euo pipefail
          zip="dist/${ASSET_PREFIX}${VERSION}.zip"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file dist/release-notes.md
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$TAG" "$zip" "${zip}.sha256" --clobber
            gh release edit "$TAG" --draft=false
          else
            echo "${TAG} is already published; its assets stay as they are."
          fi

  # Stub for a future npmjs.com channel. It publishes nothing yet. To make it real:
  #   1. The @dataart scope must exist on npmjs.com, owned by DataArt.
  #   2. Add this repository and workflow as a trusted publisher of the package on npmjs.com, so no
  #      token is stored: the job gets `id-token: write` and publishes with provenance.
  #   3. Publish to https://registry.npmjs.org, overriding the package's publishConfig registry
  #      (GitHub Packages) for this job only, then update the distribution docs and the smoke list.
  publish-npmjs:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Publish to npmjs.com (stub)
        run: echo "::notice::npmjs.com publishing is not set up yet; ${PACKAGE}@${VERSION} was not published there."
