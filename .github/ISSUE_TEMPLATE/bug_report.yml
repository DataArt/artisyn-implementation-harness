name: Bug report
description: Something in the harness, the bootstrap, or the website behaves wrongly.
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Keep it short and concrete. One bug per issue.
        If this is a security problem, stop here and follow [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the bug lives.
      options:
        - Harness skills or agents (.claude/, .canonical-implementation-harness/)
        - Harness bootstrap (/harness-bootstrap launch or patch)
        - Web Explorer (landing site)
        - Web Docs (documentation site)
        - CI / release tooling
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Harness version
      description: The release you installed from, e.g. `artisyn-harness-bootstrap-v3.5.0.zip`, or the commit if you run from this repo. For the website, the page URL is enough.
      placeholder: '3.5.0'
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Paste exact error text in a code block.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The shortest path that shows the problem. For a skill, include the command you ran and the phase it was in.
      placeholder: |
        1. Run `/dev TKT-123`
        2. Reach the Plan phase
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Whatever is relevant. Claude Code version, OS, Node version, browser.
      placeholder: |
        Claude Code 2.x · macOS 15 · Node 24
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
