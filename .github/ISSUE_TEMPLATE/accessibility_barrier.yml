name: Accessibility barrier
description: Something on the website or in the docs is hard or impossible to use with assistive technology, keyboard, zoom, or reduced motion.
title: 'a11y: '
labels: ['accessibility']
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports like this are expertise we do not have otherwise. See [ACCESSIBILITY.md](../blob/main/ACCESSIBILITY.md) for what we aim for and what we know is missing.
  - type: input
    id: where
    attributes:
      label: Where
      description: Page URL, or the doc path if it is in the repository.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
      description: What you were trying to do and what stopped you.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Your best guess is enough. Maintainers confirm it during triage. Definitions are in ACCESSIBILITY.md.
      options:
        - Critical. I could not complete a core task at all.
        - Serious. Significant difficulty, but a workaround exists.
        - Moderate. Annoyance or inconsistent experience.
        - Minor. Minimal impact on usability.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Assistive technology and version, browser, OS, zoom level, or any setting that matters.
      placeholder: |
        VoiceOver · Safari 18 · macOS 15 · 200% zoom
  - type: textarea
    id: expected
    attributes:
      label: What would have worked
      description: Optional. If you know what would fix it, say so.
