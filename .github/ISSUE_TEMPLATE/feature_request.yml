name: Feature request
description: Propose a new capability or a change to how a skill, agent, or site page works.
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        For anything beyond a small change, a proposal here comes before a pull request. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
        Harness-level conventions live in `docs/Harness/`. Check there first so the proposal builds on what exists.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Harness skills or agents
        - Harness bootstrap
        - Web Explorer (landing site)
        - Web Docs (documentation site)
        - Documentation content
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow, or impossible today. Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. A sketch is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it and why they fit less well. "None" is an acceptable answer.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to open a pull request for this.
